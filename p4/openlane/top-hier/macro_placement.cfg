# sonic_top hierarchical macro placement -- human-readable cross-check only.
#
# This is NOT consumed by the flow. Modern LibreLane places macros via the
# `MACROS.<name>.instances` object in config.json (location + orientation per
# instance), not via an OpenLane-1-style MACRO_PLACEMENT_CFG text file. The
# numbers below must match config.json's MACROS block exactly -- if you touch
# one, touch the other, and treat any mismatch as this file being stale.
#
# The old version of this file (formerly p4/openlane/top/macro_placement.cfg)
# was a shipping-scale sketch: full T=64 tiles, full LANES=64 router, all 16
# x 512 KB SRAM banks, on a 4534x4534um "14nm FinFET" die, using instance
# names (u_tile_0..3) that do not exist anywhere in sonic_top.sv. None of
# that is buildable on Sky130 -- p4/openlane/top/HANDOFF_TOP_RUN.md's own
# flat run already needed every size knob at its smallest tractable value to
# get through ABC once. This file replaces it with a real, Sky130-scale
# floorplan built from the three blocks that actually have hardened views:
# sonic_tile (T=8), sonic_router (LANES=4/SEGS=8), sonic_sram_bank
# (ADDR_WIDTH=8) -- see p4/openlane/{tile,router,sram}/config.json and
# p4/RESULTS.md / HANDOFF.md T4.1 for where those numbers came from.
#
# Real instance paths (verified against p2/rtl/sonic_top.sv and
# p2/rtl/sonic_sram.sv -- generate-block names, not the flat aliases the old
# sketch used):
#   g_tiles[i].u_tile                      i in [0, N_TILES)
#   u_router
#   u_sram.g_sram_banks[b].u_bank          b in [0, N_SRAM_BANKS)
#
# Everything else sonic_top.sv instantiates (u_seq, u_streamer, u_conv,
# u_softmax, u_lmhead, u_vec, u_sram_gate, u_mbist, u_rv32, u_noc, u_ioring)
# has NOT been hardened separately and is NOT a macro here -- it synthesizes
# as flat std-cell logic around the macro halos, same as the flat top run.
# u_phy_lpddr5x is a commercial hard macro in the real chip and, as in the
# flat run's config.json, is not instantiated by sonic_top.sv at all.
#
# Die: 5150 x 4300 um (22.15 mm^2). Orientation N for every macro (no
# rotation needed at this instance count). 250um channel between adjacent
# macros, sized for PDN straps + routing, mirroring the >=200um margins that
# made the router/tile/sram block runs close (see their own config.json
# "// util"/"// die" comments on why tight initial density broke placement).
#
# name                              x      y      orientation   footprint (w x h, um)
g_tiles[0].u_tile                   200    200    N             1200.00 x 1200.00
g_tiles[1].u_tile                   1650   200    N             1200.00 x 1200.00
g_tiles[2].u_tile                   200    1650   N             1200.00 x 1200.00
g_tiles[3].u_tile                   1650   1650   N             1200.00 x 1200.00

u_router                            3100   200    N             1005.74 x 1016.46

u_sram.g_sram_banks[0].u_bank       200    3100   N             1000.00 x 1000.00
u_sram.g_sram_banks[1].u_bank       1450   3100   N             1000.00 x 1000.00
u_sram.g_sram_banks[2].u_bank       2700   3100   N             1000.00 x 1000.00
u_sram.g_sram_banks[3].u_bank       3950   3100   N             1000.00 x 1000.00

# Open floor: x 3100-5150, y 1266-3100 (right of router, above sram row) and
# the full strip y 200-4300 beyond x 4950 near the die edge -- this is where
# the un-hardened glue logic (seq/streamer/conv/softmax/lmhead/vec/sram_gate/
# mbist/rv32/noc/ioring) and the PDN/IO ring land; the placer decides exact
# cell positions there, this file only pins the four hardened macro types.
#
# Footprints for u_router/u_sram bank come straight from the finished block
# runs' design__die__bbox in metrics.json (not re-measured here). The tile
# footprint is its DIE_AREA from p4/openlane/tile/config.json (1200x1200),
# which is >= its measured die bbox (1189.56 x 1188.64 core), so it's a safe
# upper bound until a real tile GDS/LEF exists to read exact outline from.
